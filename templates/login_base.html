<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2c7be5">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="apple-touch-icon" href="/static/icon-192x192.png">
    <meta name="google-site-verification" content="1bfnqEHYprT3LgA-Gr3B_BWGEFD_-IbwsFU4rwgVsy8">
    <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/static/sw.js')}</script>
    <title>ZiRa Finance - Masuk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.35.0/dist/tabler-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f5f6fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-box { width: 100%; max-width: 400px; padding: 1rem; }
        .card-custom { border: none; border-radius: .75rem; box-shadow: 0 0 0 1px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.04); }
        .brand-icon { font-size: 2.5rem; color: #2c7be5; }
        [data-bs-theme="dark"] body { background: #16181b; }
        [data-bs-theme="dark"] .card-custom { background: #1e2024; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="card card-custom p-4">
            <div class="text-center mb-4">
                <div class="brand-icon mb-2"><i class="ti ti-graph"></i></div>
                <h4 class="fw-bold">ZiRa Finance</h4>
                <p class="text-muted small">Masuk atau Buat Akun Baru</p>
            </div>
            {{if .Error}}
            <div class="alert alert-danger py-2 small">{{.Error}}</div>
            {{end}}
            
            <div class="my-3 text-center">
                <a href="/auth/google" class="btn btn-primary w-100 py-3 fw-bold d-flex align-items-center justify-content-center shadow-sm" style="border-radius: 12px; font-size: 0.95rem;">
                    <i class="ti ti-brand-google fs-4 me-2"></i>Lanjutkan dengan Google
                </a>
            </div>

            <div class="text-center text-muted mt-3 pt-2" style="font-size: 0.8rem;">
                <i class="ti ti-shield-check text-success me-1"></i>Otentikasi resmi & aman via Google Identity
            </div>

            <div class="text-center mt-3 d-flex justify-content-center gap-3">
                <a href="#" onclick="toggleTheme();return false" class="text-muted small text-decoration-none"><i class="ti ti-moon"></i> Tema</a>
            </div>
        </div>
        <div class="text-center mt-3">
            <span class="text-muted small">&copy; 2026 ZiRa Finance</span>
            <span class="text-muted mx-1" style="color:#d0d5dd">|</span>
            <span class="text-muted small">Dibangun dengan Go oleh <a href="https://zidstore.net" target="_blank" rel="noopener" class="text-muted text-decoration-none">ZidStore</a></span>
        </div>
    </div>
    </div>
    <script>
        function togglePW(id,btn){
            var inp=document.getElementById(id);
            if(inp.type==='password'){inp.type='text';btn.innerHTML='<i class="ti ti-eye-off"></i>';}
            else{inp.type='password';btn.innerHTML='<i class="ti ti-eye"></i>';}
        }
        function toggleTheme(){var h=document.documentElement;var t=h.getAttribute('data-bs-theme')==='dark'?'light':'dark';h.setAttribute('data-bs-theme',t);localStorage.setItem('bsTheme',t);}
        (function(){var t=localStorage.getItem('bsTheme');if(t)document.documentElement.setAttribute('data-bs-theme',t);else if(window.matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.setAttribute('data-bs-theme','dark');})();
    </script>
</body>
</html>
